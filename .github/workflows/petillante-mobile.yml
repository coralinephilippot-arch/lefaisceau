name: Pétillante — apps mobiles

on:
  workflow_dispatch:
  push:
    paths:
      - "petillante/**"
      - "petillante-mobile/**"
      - ".github/workflows/petillante-mobile.yml"

concurrency:
  group: petillante-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: petillante-mobile

jobs:
  android:
    name: Android (APK de test + AAB Google Play)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petillante-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Clé de signature (si les secrets existent)
        env:
          KEYSTORE_B64: ${{ secrets.PETILLANTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/petillante.jks"
            echo "PETILLANTE_KEYSTORE_PATH=$RUNNER_TEMP/petillante.jks" >> "$GITHUB_ENV"
            echo "Bundle signé pour Google Play."
          else
            echo "Pas de clé : bundle non signé (APK de test signé en debug)."
          fi
      - name: Compilation
        working-directory: petillante-mobile/android
        env:
          PETILLANTE_KEYSTORE_PASSWORD: ${{ secrets.PETILLANTE_KEYSTORE_PASSWORD }}
          PETILLANTE_KEY_ALIAS: ${{ secrets.PETILLANTE_KEY_ALIAS }}
          PETILLANTE_KEY_PASSWORD: ${{ secrets.PETILLANTE_KEY_PASSWORD }}
          PETILLANTE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: petillante-android-test-apk
          path: petillante-mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: petillante-android-google-play-aab
          path: petillante-mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS (vérification de compilation)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petillante-mobile/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Compilation simulateur (sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
